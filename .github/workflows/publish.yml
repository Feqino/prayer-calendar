name: Publish prayer calendar

on:
  # Rebuild nightly so the rolling window of prayer times keeps refilling.
  # 02:17 UTC — an off-the-hour time, since GitHub delays jobs scheduled on the hour.
  schedule:
    - cron: '17 2 * * *'
  # Rebuild whenever settings change.
  push:
    branches: [main]
  # Lets you rebuild on demand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check prayer times and timing rules
        run: node src/verify.js
      - name: Build feed and landing page
        run: node src/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
